<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="same-origin">
  <title>Ubah Jadwal — CoLearn</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=DM+Sans:wght@400;500&amp;display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #2563eb;
      --dark: #1d4ed8;
      --soft: #eff6ff;
      --border: #e2e8f0;
      --ink: #0f172a;
      --muted: #64748b;
    }

    body {
      font: 15px/1.6 'DM Sans', sans-serif;
      background: #fff;
      color: var(--ink);
    }

    header {
      height: 64px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: #fff;
      border-bottom: 1px solid var(--border);
      box-shadow: 0 1px 8px #0f172a0a;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
    }

    .logo svg {
      width: 146px;
      height: 28px;
    }

    .header-subtitle {
      font-size: 12px;
      color: var(--muted);
      text-align: right;
    }

    .container {
      max-width: 680px;
      margin: auto;
      padding: 32px 24px 60px;
    }

    h1 {
      font: 800 25px/1.3 'Plus Jakarta Sans', sans-serif;
      letter-spacing: -.5px;
      margin-bottom: 8px;
      overflow-wrap: anywhere;
      color: var(--ink);
    }

    h2 {
      font: 700 14px 'Plus Jakarta Sans', sans-serif;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 17px;
      display: flex;
      gap: 8px;
      align-items: center;
      color: #334155;
    }

    h2::before {
      content: '';
      height: 16px;
      width: 3px;
      flex-shrink: 0;
      background: var(--blue);
      border-radius: 2px;
    }

    .page-heading {
      margin-bottom: 26px;
    }

    .page-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 100px;
      background: #dbeafe;
      color: var(--blue);
      font: 600 12px 'Plus Jakarta Sans', sans-serif;
      margin-bottom: 14px;
    }

    .muted {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .profile {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
    }

    .profile > div {
      min-width: 0;
    }

    .tabs {
      display: flex;
      gap: 4px;
      border-radius: 13px;
      padding: 5px;
      background: #f1f5f9;
      margin: 23px 0 21px;
    }

    .tabs button {
      flex: 1;
      min-width: 0;
      padding: 11px 8px;
      border: 0;
      background: transparent;
      border-radius: 9px;
      font: 600 13px 'Plus Jakarta Sans', sans-serif;
      color: var(--muted);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 45px;
    }

    .tabs button:hover {
      background: #e2e8f0;
    }

    .tabs button.active {
      background: #fff;
      color: var(--blue);
      box-shadow: 0 1px 5px #0f172a12;
    }

    .count {
      font-size: 11px;
      color: var(--dark);
      background: #dbeafe;
      border-radius: 20px;
      padding: 2px 6px;
    }

    .card {
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 23px;
      margin-bottom: 16px;
      background: #fff;
      box-shadow: 0 4px 24px #2563eb0b;
    }

    .intro {
      margin-bottom: 17px;
    }

    .small-gap {
      margin-bottom: 14px;
    }

    .subject-options {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .subject-choice {
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      min-height: 52px;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      cursor: pointer;
    }

    .subject-choice:has(input:checked) {
      border-color: var(--blue);
      background: var(--soft);
      color: var(--dark);
    }

    .subject-choice input {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      accent-color: var(--blue);
    }

    label.field-label {
      display: block;
      font: 600 13px 'Plus Jakarta Sans', sans-serif;
      color: #334155;
      margin: 18px 0 8px;
    }

    #lookup-form label {
      display: block;
      font: 600 14px 'Plus Jakarta Sans', sans-serif;
      margin-bottom: 8px;
      color: #334155;
    }

    input[type="tel"],
    select,
    textarea {
      width: 100%;
      min-width: 0;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--ink);
      padding: 12px;
      font: 16px 'DM Sans', sans-serif;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    .phone-row {
      display: flex;
    }

    .phone-row > span {
      display: flex;
      align-items: center;
      padding: 0 12px;
      background: #f1f5f9;
      border: 1.5px solid var(--border);
      border-right: 0;
      border-radius: 12px 0 0 12px;
      font-weight: 500;
    }

    .phone-row input {
      border-radius: 0 12px 12px 0;
    }

    .summary {
      background: #f8faff;
      border-color: #dbeafe;
      box-shadow: none;
    }

    .summary-row {
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .summary-row:last-child {
      border: 0;
      padding-bottom: 0;
    }

    .summary-row strong {
      display: block;
      font: 600 13px 'Plus Jakarta Sans', sans-serif;
      color: #334155;
      margin-bottom: 4px;
    }

    .summary-row span {
      display: block;
      font-size: 14px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      color: var(--ink);
    }

    .note {
      padding: 13px 15px;
      background: var(--soft);
      color: #334155;
      border-radius: 12px;
      font-size: 12px;
      line-height: 1.65;
      margin: 15px 0;
    }

    .note.warning {
      background: #fff7ed;
      color: #9a3412;
    }

    .reservation {
      font-size: 12px;
      margin: 0 0 13px;
    }

    .error {
      padding: 12px;
      background: #fef2f2;
      color: #b91c1c;
      border-radius: 10px;
      font-size: 13px;
      margin: 12px 0;
      overflow-wrap: anywhere;
    }

    button {
      cursor: pointer;
      transition: background .15s, box-shadow .15s, transform .15s;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
    }

    .primary {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      width: 100%;
      padding: 16px;
      min-height: 52px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff;
      font: 700 15px 'Plus Jakarta Sans', sans-serif;
      box-shadow: 0 4px 16px #2563eb35;
      margin-top: 16px;
    }

    .primary:hover:not(:disabled) {
      box-shadow: 0 6px 20px #2563eb50;
      transform: translateY(-1px);
    }

    .primary:active:not(:disabled) {
      transform: translateY(0);
    }

    .primary:disabled {
      background: #e2e8f0;
      color: #64748b;
      box-shadow: none;
      cursor: not-allowed;
    }

    .text-button {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 40px;
      padding: 8px 0;
      border: 0;
      background: transparent;
      color: var(--blue);
      font: 500 13px 'DM Sans', sans-serif;
    }

    .text-button:hover:not(:disabled) {
      color: var(--dark);
      text-decoration: underline;
    }

    .secondary {
      background: #fff;
      color: var(--blue);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 16px;
      font: 600 13px 'Plus Jakarta Sans', sans-serif;
      min-height: 44px;
    }

    .profile .text-button {
      white-space: nowrap;
    }

    .helper {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 9px;
    }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .history-toolbar {
      margin-bottom: 17px;
    }

    .badge {
      display: inline-block;
      border-radius: 20px;
      background: #fff7ed;
      color: #9a3412;
      padding: 5px 9px;
      font-size: 11px;
      font-weight: 500;
    }

    .badge.done {
      background: #f0fdf4;
      color: #166534;
    }

    .badge.rejected {
      background: #fef2f2;
      color: #b91c1c;
    }

    .history-subject {
      padding: 17px 0;
      border-bottom: 1px solid var(--border);
    }

    .history-subject strong {
      font: 700 14px 'Plus Jakarta Sans', sans-serif;
      color: #334155;
    }

    .history-subject p {
      margin-top: 6px;
      overflow-wrap: anywhere;
    }

    .history-subject .note {
      margin-bottom: 0;
    }

    details {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 12px;
    }

    summary {
      padding: 9px 0;
      min-height: 40px;
      color: var(--blue);
      font: 600 13px 'Plus Jakarta Sans', sans-serif;
      cursor: pointer;
    }

    .message {
      white-space: pre-wrap;
      margin-top: 12px;
      font-size: 14px;
      overflow-wrap: anywhere;
      color: var(--ink);
    }

    .message strong {
      color: #334155;
    }

    .request-id {
      font-size: 11px;
      color: var(--muted);
      overflow-wrap: anywhere;
      margin-top: 10px;
    }

    .success-mark {
      display: grid;
      place-items: center;
      width: 52px;
      height: 52px;
      background: #f0fdf4;
      color: #166534;
      border-radius: 50%;
      font-size: 27px;
      margin-bottom: 18px;
    }

    button:disabled {
      cursor: wait;
      opacity: .65;
    }

    button:focus-visible,
    input:focus-visible,
    select:focus-visible,
    textarea:focus-visible,
    summary:focus-visible {
      outline: 3px solid #93c5fd;
      outline-offset: 3px;
    }

    [hidden] {
      display: none !important;
    }

    @media (max-width: 480px) {
      header {
        padding: 0 16px;
      }

      .logo svg {
        width: 132px;
        height: auto;
      }

      .header-subtitle {
        font-size: 11px;
        max-width: 120px;
      }

      .container {
        padding: 25px 16px 40px;
      }

      .card {
        padding: 18px;
      }

      h1 {
        font-size: 22px;
      }

      .profile {
        flex-wrap: wrap;
      }

      .subject-options {
        grid-template-columns: 1fr;
      }

      .tabs button {
        font-size: 12px;
        gap: 5px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      button {
        transition: none;
      }
    }
  </style>
</head>

  <main id="portal" class="container" aria-live="polite"></main>

  <noscript>
    Aktifkan JavaScript untuk menggunakan form perubahan jadwal.
  </noscript>

  <script>
  (() => {
    'use strict';

    const app = document.getElementById('portal');

    const HOURS =
      '⚠️ Pengajuan diproses Senin–Jumat, pukul 11.00–20.00 WIB. Pengajuan di luar jam tersebut diproses pada jam operasional berikutnya.';

    const DONE =
      'Silahkan cek jadwalnya di aplikasi/Website CoLearn';

    const REASONS = [
      'Bentrok dengan jadwal sekolah',
      'Bentrok dengan les lain',
      'Ingin ubah guru'
    ];

    const state = {
      student: null,
      schedules: null,
      draft: {},
      reason: '',
      attempt: null,
      requests: null,
      busy: false,
      view: 0
    };

    const $ = id => document.getElementById(id);

    const esc = value => String(value ?? '').replace(
      /[&<>"']/g,
      character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[character])
    );

    const icon = text =>
      '<span aria-hidden="true">' + text + '</span>';

    const note = text =>
      '<div class="note">' + esc(text) + '</div>';

    const pendingKey = () =>
      'colearn-pending-' + state.student.user_id;

    function read(key) {
      try {
        return JSON.parse(sessionStorage.getItem(key));
      } catch (_) {
        return null;
      }
    }

    function write(key, value) {
      try {
        if (value == null) {
          sessionStorage.removeItem(key);
        } else {
          sessionStorage.setItem(key, JSON.stringify(value));
        }
      } catch (_) {}
    }

    function error(message) {
      const box = $('error');

      if (box) {
        box.innerHTML =
          '<div class="error" role="alert">' +
          esc(message) +
          '</div>';
      }
    }

    async function api(url, options = {}) {
      const controller = new AbortController();

      const timer = setTimeout(
        () => controller.abort(),
        25000
      );

      try {
        const response = await fetch(url, {
          ...options,
          cache: 'no-store',
          signal: controller.signal
        });

        let data;

        try {
          data = await response.json();
        } catch (_) {
          throw new Error(
            'Respons server belum dapat dibaca. Silakan coba lagi.'
          );
        }

        if (
          !data ||
          !response.ok ||
          data.success === false ||
          data.status === 'error'
        ) {
          throw new Error(
            data?.error ||
            'Proses belum berhasil. Silakan coba lagi.'
          );
        }

        return data;

      } catch (e) {
        if (e.name === 'AbortError') {
          throw new Error(
            'Proses terlalu lama. Silakan coba lagi.'
          );
        }

        if (e instanceof TypeError) {
          throw new Error(
            'Koneksi bermasalah. Periksa internetmu lalu coba lagi.'
          );
        }

        throw e;

      } finally {
        clearTimeout(timer);
      }
    }

    function statusLabel(status) {
      if (status === 'Selesai') {
        return 'Sudah diubah';
      }

      if (status === 'Sebagian selesai') {
        return 'Sebagian sudah diubah';
      }

      return status;
    }

    function badge(status) {
      const className = status === 'Selesai'
        ? 'done'

    async function lookup(event, openHistory = false) {
      event.preventDefault();

      if (state.busy) return;

      let phone = $('phone').value
        .trim()
        .replace(/[\s()+-]/g, '');

      if (phone.startsWith('62')) {
        phone = phone.slice(2);
      }

      phone = phone.replace(/^0+/, '');
      $('phone').value = phone;

      if (!/^8\d{7,12}$/.test(phone)) {
        return error(
          'Masukkan nomor HP yang valid.'
        );
      }

      const button = $('lookup-form')
        .querySelector('button');

      state.busy = true;
      button.disabled = true;
      button.textContent = 'Mencari data...';

      try {
        const result = await api(
          '/api/lookup?hp=' +
          encodeURIComponent(phone)
        );

        if (
          result.status !== 'found' ||
          !result.data?.user_id
        ) {
          throw new Error(
            'Nomor HP belum ditemukan. Periksa kembali nomor yang terdaftar.'
          );
        }

        state.student = result.data;
        state.draft = {};
        state.reason = '';
        state.requests = null;

        write('colearn-student', state.student);

        const saved = read(pendingKey());

        state.attempt = (
          saved?.user_id === state.student.user_id &&
          saved.submission_key &&
          saved.jadwalBaru
        ) ? saved : null;

        if (state.attempt) {
          Object.entries(
            state.attempt.jadwalBaru
          ).forEach(([name, item]) => {
            state.draft[name] =
              String(item.slot || '');
          });

          state.reason =
            String(state.attempt.alasan || '');
        }

        history.replaceState(
          null,
          '',
          '/' + encodeURIComponent(state.student.user_id)
        );

        state.busy = false;

        if (openHistory) {
          await showHistory();
        } else {
          await showForm();
        }

      } catch (e) {
        error(e.message);

      } finally {
        state.busy = false;

        if (button.isConnected) {
          button.disabled = false;
          button.innerHTML =
            'Cek Data ' + icon('→');
        }
      }
    }

    function subjects() {
      const p = String(
        state.student.package_name || ''
      );

      const result = [];

      const grade = parseInt(
        state.student.grade,
        10
      );

      if (/matematika|\bmtk\b|\bmat\b/i.test(p)) {
        result.push(
          /2\s*x/i.test(p)
            ? 'Matematika 2x/minggu'
            : 'Matematika 1x/minggu'
        );
      }

      if (
        /\bipa\b/i.test(p) &&
        grade >= 4 &&
        grade <= 10
      ) {
        result.push('IPA');
      }

      if (/fisika/i.test(p) && grade >= 11) {
        result.push('Fisika');
      }

      if (/kimia/i.test(p) && grade >= 11) {
        result.push('Kimia');
      }

      return result;
    }

    function choices(subject) {
      const order = [
        'Senin',
        'Selasa',
        'Rabu',
        'Kamis',
        'Jumat',
        'Sabtu',
        'Minggu'
      ];

      function start(row) {
        const match = String(
          row.session_time
        ).match(/(\d{1,2})[:.](\d{2})/);

        return match
          ? Number(match[1]) * 60 + Number(match[2])
          : 9999;
      }

      function day(row) {
        const index = order.indexOf(
          String(row.days).split(',')[0].trim()
        );

        return index < 0 ? 99 : index;
      }

      return (state.schedules || [])
        .filter(row => {
          const name = String(
            row.subject || ''
          ).trim();

          const key = name === 'Matematika'
            ? (
              /2\s*x/i.test(String(row.frequency))
                ? 'Matematika 2x/minggu'
                : 'Matematika 1x/minggu'
            )
            : name;

          return (
            parseInt(row.course_grade, 10) ===
              parseInt(state.student.grade, 10) &&
            key === subject &&
            String(row.status).trim() === 'Available' &&
            parseInt(row.sisa_kursi, 10) > 0 &&
            String(row.slot_name || '').trim()
          );
        })
        .sort((a, b) =>
          day(a) - day(b) ||
          start(a) - start(b)
        );
    }

    const scheduleLabel = row =>
      `${row.days || ''}, ${row.session_time || ''} WIB` +
      (row.teacher_name
        ? ' — ' + row.teacher_name
        : '');

    function firstClass(raw) {
      if (!raw) return '';

      const text = String(raw).trim();

      const match = text.match(
        /^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/
      );

      const date = match
        ? new Date(Date.UTC(
            Number(match[3]),
            Number(match[2]) - 1,
            Number(match[1])
          ))
        : new Date(raw);

      if (isNaN(date.getTime())) return '';

      function key(value) {
        const parts = new Intl.DateTimeFormat(
          'en',
          {
            timeZone: 'Asia/Jakarta',
            year: 'numeric',
            month: '2-digit',
            day: '2-digit'
          }
        ).formatToParts(value);

        return ['year', 'month', 'day']
          .map(type =>
            parts.find(part =>
              part.type === type
            ).value
          )
          .join('-');
      }

      if (key(date) <= key(new Date())) {
        return '';
      }

      return ' • 🆕 Kelas belum mulai (' +
        date.toLocaleDateString('id-ID', {
          timeZone: 'Asia/Jakarta',
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        }) + ')';
    }

    function collect() {
      const names = subjects().filter(name =>
        Object.prototype.hasOwnProperty.call(
          state.draft,
          name
        )
      );

      const items = names.map(name => ({
        name: name,
        row: choices(name).find(row =>
          String(row.slot_name) ===
          state.draft[name]
        )
      }));

      const ready = items.filter(item =>
        item.row
      );

      function time(row) {
        const match = String(
          row.session_time
        ).match(
          /(\d{1,2})[:.](\d{2})\s*[-–—]\s*(\d{1,2})[:.](\d{2})/
        );

        return match
          ? [
              Number(match[1]) * 60 + Number(match[2]),
              Number(match[3]) * 60 + Number(match[4])
            ]
          : null;
      }

      function days(row) {
        return String(row.days)
          .toLowerCase()
          .match(
            /senin|selasa|rabu|kamis|jumat|sabtu|minggu/g
          ) || [];
      }

      const conflicts = [];

      ready.forEach((a, i) => {
        ready.slice(i + 1).forEach(b => {
          const x = time(a.row);
          const y = time(b.row);

          if (
            x && y &&
            days(a.row).some(day =>
              days(b.row).includes(day)
            ) &&
            x[0] < y[1] &&
            y[0] < x[1]
          ) {
            conflicts.push(
              a.name + ' dan ' + b.name
            );
          }
        });
      });

      return {
        items: items,
        conflicts: conflicts,
        valid: (
          items.length > 0 &&
          items.every(item => item.row) &&
          Boolean(state.reason.trim()) &&
          state.reason.trim().length <= 2000 &&
          !conflicts.length
        )
      };
    }

    function setSending(value) {
      state.busy = value;

      app.querySelectorAll(
        'button, input, select, textarea'
      ).forEach(control => {
        control.disabled = value;
      });
    }

    async function submit(event) {
      event.preventDefault();

      if (state.busy) return;

      const result = collect();

      if (!result.valid) {
        updateSummary();
        return;
      }

      const jadwalBaru = {};

      result.items.forEach(item => {
        jadwalBaru[item.name] = {
          slot: String(item.row.slot_name),
          label: scheduleLabel(item.row)
        };
      });

      const same = (
        state.attempt &&
        state.attempt.alasan === state.reason.trim() &&
        JSON.stringify(state.attempt.jadwalBaru) ===
          JSON.stringify(jadwalBaru)
      );

      const payload = {
        action: 'submit',
        user_id: state.student.user_id,
        submission_key: same
          ? state.attempt.submission_key
          : crypto.randomUUID(),
        alasan: state.reason.trim(),
        jadwalBaru: jadwalBaru
      };

      state.attempt = payload;
      write(pendingKey(), payload);

      setSending(true);

      $('send-button').textContent =
        'Mengirim pengajuan...';

      $('error').innerHTML = '';

      try {
        const data = await api('/api/submit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (
          data.success !== true ||
          !data.request_id
        ) {
          throw new Error(
            'Penyimpanan belum terkonfirmasi.'
          );
        }

        write(pendingKey(), null);

        state.attempt = null;
        state.draft = {};
        state.reason = '';
        state.schedules = null;
        state.requests = null;
        state.busy = false;
        state.view++;

        app.innerHTML = `
          ${shell('form')}

          <section class="card">
            <div class="success-mark">
              ${icon('✓')}
            </div>

            <h1>Pengajuan sudah diterima!</h1>

              class="primary"
              data-action="history">
              Lihat Status Pengajuan ${icon('→')}
            </button>
          </section>

          <div id="error"></div>
        `;

      } catch (e) {
        setSending(false);

        $('send-button').innerHTML =
          'Ajukan Perubahan Jadwal ' + icon('→');

        updateSummary();

        error(
          e.message +
          ' Cek riwayat sebelum mencoba lagi. ' +
          'Pengiriman ulang dengan pilihan yang sama memakai ID pengiriman yang sama.'
        );

        $('error').insertAdjacentHTML(
          'beforeend',
          '<button type="button" class="text-button" data-action="history">' +
          'Cek riwayat pengajuan ' + icon('→') +
          '</button>'
        );
      }
    }

    app.addEventListener('submit', event => {
      if (event.target.id === 'lookup-form') {
        lookup(event);
      }

      if (event.target.id === 'change-form') {
        submit(event);

    });

    app.addEventListener('change', event => {
      const target = event.target;

      if (target.dataset.subject !== undefined) {
        const name = subjects()[
          Number(target.dataset.subject)
        ];

        if (target.checked) {
          state.draft[name] = '';
        } else {
          delete state.draft[name];
        }

        renderSchedules();
        updateSummary();
      }

      if (target.dataset.slot !== undefined) {
        state.draft[
          subjects()[Number(target.dataset.slot)]
        ] = target.value;

        updateSummary();
      }

      if (target.id === 'reason') {
        $('other-field').hidden =
          target.value !== 'other';

        state.reason = target.value === 'other'
          ? $('other').value
          : target.value;

        updateSummary();
      }
    });

    app.addEventListener('input', event => {
      if (event.target.id === 'phone') {
        event.target.value =
          event.target.value.replace(/^0+/, '');
      }

      if (event.target.id === 'other') {
        state.reason = event.target.value;
        updateSummary();
      }
    });

    app.addEventListener('click', async event => {
      const button = event.target.closest(
        '[data-action]'
      );

      if (!button || state.busy) return;

      const action = button.dataset.action;

      if (action === 'form') {
        showForm();
      }

      if (action === 'history') {
        showHistory();
      }

      if (action === 'logout') {
        write('colearn-student', null);

        state.student = null;
        state.draft = {};
        state.reason = '';
        state.attempt = null;
        state.requests = null;

        history.replaceState(null, '', '/');
        showLogin();
      }

      if (action === 'copy') {
        const link = location.origin + '/' +
          encodeURIComponent(state.student.user_id);

        try {
          await navigator.clipboard.writeText(link);

          if ($('copy-result')) {
            $('copy-result').textContent =
              'Link riwayat berhasil disalin.';
          }

        } catch (_) {
          if ($('copy-result')) {
            $('copy-result').textContent = link;
          }
        }
      }
    });

    let path = '';

    try {
      path = decodeURIComponent(
        location.pathname.replace(/^\/+|\/+$/g, '')
      );
    } catch (_) {}

    const saved = read('colearn-student');

    if (
      saved?.user_id &&
      saved.phone_number &&
      (
        !path ||
        path === 'index.html' ||
        path === saved.user_id
      )
    ) {
      showLogin('Memuat data murid...');

      $('phone').value = saved.phone_number;

      lookup(
        { preventDefault() {} },
        path === saved.user_id
      );

    } else {
      showLogin(
        path && path !== 'index.html'
          ? 'Masukkan nomor HP terdaftar untuk membuka halaman murid.'
          : ''
      );
    }
  })();
  </script>
</body>
</html>
