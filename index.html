<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="same-origin">
  <title>Ubah Jadwal — CoLearn</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=DM+Sans:wght@400;500&amp;display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #2563EB;
      --blue-dark: #1D4ED8;
      --blue-light: #EFF6FF;
      --blue-mid: #DBEAFE;
      --orange: #F97316;
      --green: #16A34A;
      --green-light: #F0FDF4;
      --gray-50: #FFFFFF;
      --gray-100: #F1F5F9;
      --gray-200: #E2E8F0;
      --gray-400: #94A3B8;
      --gray-500: #64748B;
      --gray-700: #334155;
      --gray-900: #0F172A;
      --radius: 12px;
      --shadow: 0 4px 24px rgba(37,99,235,.08);
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--gray-50);
      min-height: 100vh;
      color: var(--gray-900);
    }

    header {
      background: white;
      border-bottom: 1px solid var(--gray-200);
      padding: 0 24px;
      height: 64px;
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 1px 8px rgba(0,0,0,.06);
    }

    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
    }

    .header-subtitle {
      margin-left: auto;
      font-size: 13px;
      color: var(--gray-500);
      font-weight: 500;
    }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 40px 20px 80px;
    }

    .page-header {
      margin-bottom: 32px;
    }

    .page-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--blue-mid);
      color: var(--blue);
      font-size: 12px;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 100px;
      margin-bottom: 12px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      letter-spacing: .3px;
    }

    .page-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 28px;
      font-weight: 800;
      color: var(--gray-900);
      line-height: 1.25;
      letter-spacing: -.5px;
      margin-bottom: 8px;
      overflow-wrap: anywhere;
    }

    .page-desc {
      color: var(--gray-500);
      font-size: 15px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 28px;
      box-shadow: var(--shadow);
      border: 1px solid var(--gray-200);
      margin-bottom: 16px;
    }

    .card-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      font-weight: 700;
      color: var(--gray-700);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .card-title::before {
      content: '';
      width: 3px;
      height: 16px;
      background: var(--blue);
      border-radius: 2px;
      display: block;
      flex-shrink: 0;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: var(--gray-700);
      margin-bottom: 8px;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    input[type="text"],
    input[type="tel"],
    select,
    textarea {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius);
      font-size: 16px;
      font-family: 'DM Sans', sans-serif;
      color: var(--gray-900);
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 2px solid var(--blue);
      outline-offset: 2px;
    }

    textarea {
      resize: vertical;
      min-height: 100px;
    }

    .btn-submit {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--blue), #4F46E5);
      color: white;
      border: 0;
      border-radius: var(--radius);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(37,99,235,.35);
      letter-spacing: .2px;
      margin-top: 8px;
    }

    @media (max-width: 480px) {
      .card {
        padding: 20px;
      }

      .page-title {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="#" aria-label="CoLearn">
      <svg height="28" viewBox="0 0 1309 250" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="CoLearn">

    </a>

    <span class="header-subtitle">
      Formulir Perubahan Jadwal
    </span>
  </header>

  <div id="page-form"></div>

  <noscript>
    Aktifkan JavaScript untuk menggunakan form perubahan jadwal.
  </noscript>

  <script>
  (() => {
    const root = document.getElementById('page-form');

    root.style.display = 'block';
    root.innerHTML =
      '<main class="container" id="portal" aria-live="polite"></main>';

    const app = document.getElementById('portal');

    const hours =
      'Pengajuan diproses pada jam operasional: Senin–Jumat, pukul 11.00–20.00 WIB. Pengajuan di luar jam tersebut akan diproses pada jam operasional berikutnya.';

    const completion =
      'Silahkan cek jadwalnya di aplikasi/Website CoLearn';

    let student = null;
    let schedules = null;
    let screen = 'login';
    let busy = false;
    let draft = {};
    let reason = '';
    let pending = null;
    let view = 0;

    const esc = value => String(value ?? '').replace(
      /[&<>"']/g,
      character => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[character])
    );

    const style = document.createElement('style');

    style.textContent = `
      #portal .row {
        display:flex;
        justify-content:space-between;
        align-items:center;
        gap:12px;
        flex-wrap:wrap;
      }

      #portal .muted {
        color:var(--gray-500);
        font-size:13px;
        line-height:1.6;
      }

      #portal .note {
        padding:14px 16px;
        background:var(--blue-light);
        border-radius:12px;
        font-size:13px;
        line-height:1.65;
        margin:18px 0;
      }

      #portal .error {
        color:#B91C1C;
        background:#FEF2F2;
        padding:12px;
        border-radius:12px;
        margin:12px 0;
        line-height:1.6;
      }

      #portal .secondary {
        background:white;
        color:var(--blue);
        border:1px solid var(--gray-200);
        border-radius:12px;
        padding:11px 16px;
        font:600 13px 'Plus Jakarta Sans',sans-serif;
        cursor:pointer;
        min-height:44px;
      }

      #portal .tabs {
        display:flex;
        gap:8px;
        margin:24px 0;
        border-bottom:1px solid var(--gray-200);
      }

      #portal .tabs button {
        border:0;
        border-bottom:3px solid transparent;
        background:none;
        padding:13px 8px;
        color:var(--gray-500);
        font:700 13px 'Plus Jakarta Sans',sans-serif;
        cursor:pointer;
      }

      #portal .tabs .active {
        color:var(--blue);
        border-bottom-color:var(--blue);
      }

      #portal .badge {
        display:inline-block;
        border-radius:100px;
        background:#FFF7ED;
        color:#9A3412;
        padding:5px 10px;
        font-size:12px;
        font-weight:500;
      }

      #portal .badge.done {
        background:var(--green-light);
        color:#166534;
      }

      #portal .badge.rejected {
        background:#FEF2F2;
        color:#B91C1C;
      }

      #portal .subject {
        padding:17px 0;
        border-bottom:1px solid var(--gray-200);
      }

      #portal .subject:last-child {
        border:0;
      }

      #portal .subject p {
        margin-top:7px;
        line-height:1.65;
        overflow-wrap:anywhere;
      }

      #portal .subject strong,
      #portal summary {
        font-family:'Plus Jakarta Sans',sans-serif;
        font-size:14px;
      }

      #portal details {
        margin-top:14px;
        padding-top:12px;
        border-top:1px solid var(--gray-200);
      }

      #portal summary {
        cursor:pointer;
        color:var(--blue);
        padding:8px 0;
        min-height:40px;
      }

      #portal .message {
        white-space:pre-wrap;
        margin-top:12px;
        line-height:1.6;
        overflow-wrap:anywhere;
      }

      #portal .choice {
        display:flex;
        align-items:center;
        gap:10px;
        border:1.5px solid var(--gray-200);
        padding:14px;
        border-radius:12px;
        cursor:pointer;
        margin-bottom:10px;
      }

      #portal .choice:has(input:checked) {
        border-color:var(--blue);
        background:var(--blue-light);
      }

      #portal .choice input {
        width:18px;
        height:18px;
        accent-color:var(--blue);
        flex-shrink:0;
      }

      #portal .form-group {
        margin-top:18px;
      }

      #portal button:disabled {
        opacity:.6;
        cursor:wait;
        transform:none;
      }

      #portal .btn-submit {
        margin-top:16px;
      }

      #portal input,
      #portal select,
      #portal textarea {
        font-size:16px;
        min-width:0;
      }

      #portal .request-id {
        overflow-wrap:anywhere;
        font-size:11px;
        color:var(--gray-500);
      }

      #portal [hidden] {
        display:none!important;
      }

      @media(max-width:480px) {
        header {
          padding:0 16px;
          gap:8px;
        }

        .logo svg {
          max-width:132px;
          height:auto;
        }

        .header-subtitle {
          font-size:11px;
          max-width:130px;
        }

        .container {
          padding-top:28px;
        }

        #portal .card {
          padding:20px;
        }
      }
    `;

    document.head.appendChild(style);

    const notice = text =>
      '<div class="note">' + esc(text) + '</div>';

    const primary = (text, action) =>
      '<button type="button" class="btn-submit" data-action="' +
      action + '">' + text + '</button>';

    const badge = status =>
      '<span class="badge ' +
      (
        status === 'Selesai'
          ? 'done'
          : status === 'Tidak dapat diproses'
            ? 'rejected'
            : ''
      ) +
      '">' +
      esc(status === 'Selesai' ? 'Sudah diubah' : status) +
      '</span>';

    function store(key, value) {
      try {
        if (value == null) {
          sessionStorage.removeItem(key);
        } else {
          sessionStorage.setItem(key, JSON.stringify(value));
        }
      } catch (_) {}
    }

    function load(key) {
      try {
        return JSON.parse(sessionStorage.getItem(key));
      } catch (_) {
        return null;
      }
    }

    const pendingKey = () =>
      'colearn-pending-' + student.user_id;

    function showError(message) {
      app.querySelector('#error').innerHTML =
        '<div class="error" role="alert">' +
        esc(message) + '</div>';
    }

    async function api(url, options = {}) {
      const controller = new AbortController();

      const timer = setTimeout(
        () => controller.abort(),
        25000
      );

      try {
        const response = await fetch(url, {
          ...options,
          cache: 'no-store',
          signal: controller.signal
        });

        let data;

        try {
          data = await response.json();
        } catch (_) {
          throw new Error(
            'Respons server belum dapat dibaca. Silakan coba lagi.'
          );
        }

        if (
          !response.ok ||
          data.success === false ||
          data.status === 'error'
        ) {
          throw new Error(
            data.error || 'Terjadi kendala. Silakan coba lagi.'
          );
        }

        return data;

      } catch (error) {
        if (error.name === 'AbortError') {
          throw new Error(
            'Proses terlalu lama. Silakan coba lagi.'
          );
        }

        if (error instanceof TypeError) {
          throw new Error(
            'Koneksi bermasalah. Periksa internetmu lalu coba lagi.'
          );
        }

        throw error;

      } finally {
        clearTimeout(timer);
      }
    }

    function header(tab) {
      return `
        <div class="page-badge">📅 Perubahan Jadwal</div>

        <h1 class="page-title">
          Halo, ${esc(student.name)}
        </h1>

        <p class="page-desc">
          Kelas ${esc(student.grade)} ·
          ${esc(student.package_name)}
        </p>

        <div class="tabs">
          <button
            data-action="home"
            class="${tab === 'home' ? 'active' : ''}">
            Ajukan Perubahan
          </button>

          <button
            data-action="history"
            class="${tab === 'history' ? 'active' : ''}">
            Riwayat Pengajuan
          </button>
        </div>
      `;
    }

    function login(message = '') {
      screen = 'login';
      view++;

      app.innerHTML = `
        <div class="page-header">
          <div class="page-badge">
            📅 Perubahan Jadwal
          </div>

          <h1 class="page-title">
            Ajukan Perubahan<br>Jadwal Belajarmu
          </h1>

          <p class="page-desc">
            Masukkan nomor HP terdaftar untuk mengajukan
            dan melihat riwayat perubahan jadwal.
          </p>
        </div>

        <form class="card" id="lookup">
          <div class="card-title">Cek Data Murid</div>

          <label for="phone">Nomor HP Murid</label>

          <input
            id="phone"
            type="tel"
            autocomplete="tel"
            placeholder="Contoh: 081234567890"
            required>

          <div id="error">
            ${message ? notice(message) : ''}
          </div>

          <button class="btn-submit" type="submit">
            Cek Data
          </button>
        </form>

        ${notice(hours)}
      `;
    }

    async function lookup(event) {
      event.preventDefault();
      if (busy) return;

      let phone = document.getElementById('phone')
        .value.trim().replace(/[\s()+-]/g, '');

      if (phone.startsWith('62')) {
        phone = phone.slice(2);
      } else if (phone.startsWith('0')) {
        phone = phone.slice(1);
      }

      if (!/^8\d{7,12}$/.test(phone)) {
        return showError('Masukkan nomor HP yang valid.');
      }

      busy = true;

      const button = app.querySelector(
        'button[type="submit"]'
      );

      button.disabled = true;
      button.textContent = 'Mencari data...';

      try {
        const data = await api(
          '/api/lookup?hp=' + encodeURIComponent(phone)
        );

        if (data.status !== 'found') {
          throw new Error(
            'Nomor HP belum ditemukan. Periksa kembali nomor yang terdaftar.'
          );
        }

        student = data.data;
        store('colearn-student', student);
        pending = load(pendingKey());

        history.replaceState(
          null,
          '',
          '/' + encodeURIComponent(student.user_id)
        );

        home();

      } catch (error) {
        showError(error.message);

      } finally {
        busy = false;

        if (button.isConnected) {
          button.disabled = false;
          button.textContent = 'Cek Data';
        }
      }
    }

    function home() {
      screen = 'home';
      view++;

      app.innerHTML = `
        ${header('home')}

        <section class="card">
          <div class="card-title">
            Ajukan Perubahan Jadwal
          </div>

          <p class="page-desc">
            Pilih mata pelajaran dan jadwal baru
            sesuai paket belajarmu.
          </p>

          ${primary('Ajukan Perubahan Jadwal →', 'form')}
        </section>

        <div id="error"></div>

        ${notice(hours)}

        ${pending ? `
          ${notice(
            'Pengiriman sebelumnya belum terkonfirmasi. Cek riwayat atau coba kirim kembali pengajuan yang sama.'
          )}

          <button
            class="secondary"
            data-action="retry-pending">
            Buka Pengajuan Sebelumnya
          </button>
        ` : ''}

        <p style="margin-top:18px">
          <button class="secondary" data-action="copy">
            Salin Link Riwayat
          </button>

          <button class="secondary" data-action="logout">
            Ganti Murid
          </button>
        </p>

        <div id="copy-result" class="muted"></div>
      `;
    }

    function subjects() {
      const p = String(student.package_name);
      const result = [];

      if (/matematika|\bmtk\b|\bmat\b/i.test(p)) {
        result.push(
          /2\s*x/i.test(p)
            ? 'Matematika 2x/minggu'
            : 'Matematika 1x/minggu'
        );
      }

      if (/\bipa\b/i.test(p)) result.push('IPA');
      if (/fisika/i.test(p)) result.push('Fisika');
      if (/kimia/i.test(p)) result.push('Kimia');

      return result;
    }

    function slots(subject) {
      return (schedules || []).filter(row => {
        const name = String(row.subject || '').trim();

        const key = name === 'Matematika'
          ? (
            /2\s*x/i.test(String(row.frequency))
              ? 'Matematika 2x/minggu'
              : 'Matematika 1x/minggu'
          )
          : name;

        return (
          Number(row.course_grade) ===
            parseInt(student.grade, 10) &&
          key === subject &&
          String(row.status).trim() === 'Available' &&
          parseInt(row.sisa_kursi, 10) > 0 &&
          String(row.slot_name || '').trim()
        );
      });
    }

    const scheduleLabel = row =>
      String(row.days || '') + ', ' +
      String(row.session_time || '') + ' WIB' +
      (row.teacher_name ? ' — ' + row.teacher_name : '');

    function firstClass(raw) {
      if (!raw) return '';

      const text = String(raw).trim();

      const match = text.match(
        /^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/
      );

      const date = match
        ? new Date(
            Number(match[3]),
            Number(match[2]) - 1,
            Number(match[1])
          )
        : new Date(raw);

      if (isNaN(date.getTime())) return '';

      const day = new Intl.DateTimeFormat('en-CA', {
        timeZone: 'Asia/Jakarta',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });

      if (day.format(date) <= day.format(new Date())) {
        return '';
      }

      return ' • 🆕 Kelas belum mulai (' +
        date.toLocaleDateString('id-ID', {
          timeZone: 'Asia/Jakarta',
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        }) + ')';
    }

    async function form() {
      screen = 'form';
      const current = ++view;

      if (!schedules) {
        app.innerHTML = `
          ${header('home')}
          <div class="card">
            Memuat jadwal tersedia...
          </div>
          <div id="error"></div>
        `;

        try {
          const rows = await api('/api/jadwal');

          if (!Array.isArray(rows)) {
            throw new Error('Data jadwal tidak valid.');
          }

          schedules = rows;

        } catch (error) {
          if (current !== view) return;

          app.innerHTML = `
            ${header('home')}
            <div id="error"></div>
            ${primary('Coba Muat Jadwal Lagi', 'form')}
          `;

          showError(error.message);
          return;
        }

        if (current !== view) return;
      }

      const list = subjects();

      app.innerHTML = `
        ${header('home')}

        <form id="request">
          <section class="card">
            <div class="card-title">
              Mata Pelajaran yang Ingin Diubah
            </div>

            ${list.length
              ? list.map((name, i) => `
                <label class="choice">
                  <input
                    type="checkbox"
                    data-subject="${i}"
                    ${
                      Object.prototype.hasOwnProperty.call(
                        draft,
                        name
                      ) ? 'checked' : ''
                    }>
                  <span>${esc(name)}</span>
                </label>
              `).join('')
              : `
                <p class="page-desc">
                  Mata pelajaran paketmu belum dikenali.
                  Hubungi Kakak Siaga agar datanya diperiksa.
                </p>
              `
            }
          </section>

          <section class="card" id="slot-fields"></section>

          <section class="card">
            <div class="card-title">
              Alasan Perubahan
            </div>

            <label for="reason">
              Kenapa ingin mengubah jadwal?
            </label>

            <select id="reason">
              <option value="">-- Pilih alasan --</option>
              <option>Bentrok dengan jadwal sekolah</option>
              <option>Bentrok dengan les lain</option>
              <option>Ingin ubah guru</option>
              <option value="lain">Alasan lain...</option>
            </select>

            <div id="other-reason" hidden>
              <label for="other" style="margin-top:16px">
                Ceritakan alasanmu
              </label>

              <textarea
                id="other"
                maxlength="2000"></textarea>
            </div>
          </section>

          ${notice(hours)}

          ${notice(
            'Pilihan jadwal belum menjadi reservasi. Selama pengajuan diproses, ikuti jadwal yang masih aktif.'
          )}

          <div id="error"></div>

          <button type="submit" class="btn-submit">
            Cek Pengajuan →
          </button>
        </form>
      `;

      const reasonSelect =
        document.getElementById('reason');

      const standard = [
        'Bentrok dengan jadwal sekolah',
        'Bentrok dengan les lain',
        'Ingin ubah guru'
      ];

      reasonSelect.value = reason
        ? (standard.includes(reason) ? reason : 'lain')
        : '';

      document.getElementById('other-reason').hidden =
        reasonSelect.value !== 'lain';

      document.getElementById('other').value =
        standard.includes(reason) ? '' : reason;

      renderSlots();
    }

    function renderSlots() {
      const list = subjects();
      const field =
        document.getElementById('slot-fields');

      field.hidden = !Object.keys(draft).length;

      field.innerHTML = `
        <div class="card-title">
          Pilih Jadwal Baru
        </div>

        ${Object.keys(draft).map(name => {
          const i = list.indexOf(name);
          const rows = slots(name);

          return `
            <div class="form-group">
              <label for="slot-${i}">
                ${esc(name)}
              </label>

              <select id="slot-${i}" data-slot="${i}">
                <option value="">
                  -- Pilih jadwal baru --
                </option>

                ${rows.map((row, j) => `
                  <option
                    value="${j}"
                    ${draft[name] === String(j)
                      ? 'selected'
                      : ''}>
                    ${esc(
                      scheduleLabel(row) +
                      ' (sisa: ' + row.sisa_kursi + ')' +
                      firstClass(
                        row.first_class_on_that_slot
                      )
                    )}
                  </option>
                `).join('')}
              </select>

              ${!rows.length ? `
                <p class="muted">
                  Belum ada slot tersedia
                  untuk mata pelajaran ini.
                </p>
              ` : ''}
            </div>
          `;
        }).join('')}
      `;
    }

    function hasConflict(rows) {
      function minutes(row) {
        const match = String(row.session_time).match(
          /(\d{1,2})[:.](\d{2})\s*[-–—]\s*(\d{1,2})[:.](\d{2})/
        );

        return match
          ? [
              Number(match[1]) * 60 + Number(match[2]),
              Number(match[3]) * 60 + Number(match[4])
            ]
          : null;
      }

      function days(row) {
        return String(row.days)
          .toLowerCase()
          .split(/,|&|\bdan\b|\//)
          .map(day => day.trim());
      }

      return rows.some((a, i) =>
        rows.slice(i + 1).some(b => {
          const x = minutes(a);
          const y = minutes(b);

          return (
            x && y &&
            days(a).some(day => days(b).includes(day)) &&
            x[0] < y[1] &&
            y[0] < x[1]
          );
        })
      );
    }

    function prepare(event) {
      event.preventDefault();

      const names = Object.keys(draft);

      if (!names.length) {
        return showError(
          'Pilih minimal satu mata pelajaran.'
        );
      }

      const selected = names.map(name =>
        draft[name] === ''
          ? null
          : slots(name)[Number(draft[name])]
      );

      if (selected.some(row => !row)) {
        return showError(
          'Pilih jadwal baru untuk setiap mata pelajaran.'
        );
      }

      if (hasConflict(selected)) {
        return showError(
          'Jadwal pilihanmu bentrok. Pilih hari atau jam yang berbeda.'
        );
      }

      const r = document.getElementById('reason');

      reason = r.value === 'lain'
        ? document.getElementById('other').value.trim()
        : r.value;

      if (!reason) {
        return showError(
          'Isi alasan perubahan terlebih dahulu.'
        );
      }

      const jadwalBaru = {};

      names.forEach((name, i) => {
        jadwalBaru[name] = {
          slot: String(selected[i].slot_name),
          label: scheduleLabel(selected[i])
        };
      });

      const same = (
        pending &&
        pending.user_id === student.user_id &&
        pending.alasan === reason &&
        JSON.stringify(pending.jadwalBaru) ===
          JSON.stringify(jadwalBaru)
      );

      pending = {
        action: 'submit',
        user_id: student.user_id,
        submission_key: same
          ? pending.submission_key
          : crypto.randomUUID(),
        alasan: reason,
        jadwalBaru: jadwalBaru
      };

      store(pendingKey(), pending);
      review();
    }

    function review() {
      screen = 'review';
      view++;

      app.innerHTML = `
        ${header('home')}

        <section class="card">
          <div class="card-title">
            Cek Pengajuanmu
          </div>

          ${Object.entries(pending.jadwalBaru)
            .map(([name, info]) => `
              <div class="subject">
                <strong>${esc(name)}</strong>
                <p>${esc(info.label)}</p>
              </div>
            `).join('')
          }

          <p class="message"><b>Alasan:</b> ${esc(pending.alasan)}</p>
        </section>

        ${notice(hours)}
        <div id="error"></div>

        ${primary('Kirim Pengajuan', 'send')}

        <p style="margin-top:15px">
          <button class="secondary" data-action="form">
            Ubah Pilihan
          </button>

          <button class="secondary" data-action="history">
            Cek Riwayat
          </button>
        </p>
      `;
    }

    async function send(button) {
      if (busy || !pending) return;

      busy = true;
      button.disabled = true;
      button.textContent = 'Mengirim pengajuan...';

      try {
        const data = await api('/api/submit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(pending)
        });

        if (
          data.success !== true ||
          !data.request_id
        ) {
          throw new Error(
            'Penyimpanan belum terkonfirmasi.'
          );
        }

        pending = null;
        store(pendingKey(), null);
        draft = {};
        reason = '';
        screen = 'success';
        view++;

        app.innerHTML = `
          ${header('home')}

          <section class="card">
            <h2 class="page-title">
              Pengajuan sudah diterima! 🎉
            </h2>

            <p class="page-desc">
              Kakak Siaga akan memproses
              perubahan jadwalmu.
            </p>

            ${notice(hours)}

            <p class="page-desc">
              Pantau status di Riwayat Pengajuan.
              Tidak perlu konfirmasi melalui WhatsApp.
            </p>

            ${primary(
              'Lihat Status Pengajuan',
              'history'
            )}
          </section>

          <div id="error"></div>
        `;

      } catch (error) {
        showError(
          error.message +
          ' Cek riwayat sebelum mencoba lagi. ' +
          'Pengiriman ulang dari halaman ini menggunakan ID yang sama.'
        );

      } finally {
        busy = false;

        if (button.isConnected) {
          button.disabled = false;
          button.textContent = 'Kirim Pengajuan';
        }
      }
    }

    async function historyPage() {
      screen = 'history';
      const current = ++view;

      app.innerHTML = `
        ${header('history')}

        <div class="card">
          Memuat riwayat pengajuan...
        </div>

        <div id="error"></div>
      `;

      try {
        const data = await api(
          '/api/history?user_id=' +
          encodeURIComponent(student.user_id)
        );

        if (current !== view) return;

        const requests = [...data.requests].sort(
          (a, b) =>
            Date.parse(b.submitted_at) -
            Date.parse(a.submitted_at)
        );

        app.innerHTML = `
          ${header('history')}

          <div class="row">
            <span class="muted">
              ${requests.length} pengajuan ·
              Terbaru lebih dulu
            </span>

            <button
              class="secondary"
              data-action="history">
              Perbarui Status
            </button>
          </div>

          ${requests.length
            ? requests.map((request, i) => `
              <article
                class="card"
                style="margin-top:18px">

                <div class="row">
                  <span class="muted">
                    Diajukan
                    ${esc(request.submitted_at_wib)}
                  </span>

                  ${badge(request.status)}
                </div>

                ${request.items.map(item => `
                  <div class="subject">
                    <div class="row">
                      <strong>
                        ${esc(item.subject)}
                      </strong>

                      ${badge(item.status)}
                    </div>

                    <p>
                      <span class="muted">
                        Jadwal pada pengajuan ini
                      </span><br>
                      ${esc(item.schedule)}
                    </p>

                    ${
                      item.status === 'Selesai'
                        ? notice(completion)
                        : ''
                    }

                    ${item.message ? `
                      <p class="message"><b>Pesan Kakak Siaga:</b><br>${esc(item.message)}</p>
                    ` : ''}
                  </div>
                `).join('')}

                <details ${i === 0 ? 'open' : ''}>
                  <summary>Detail pengajuan</summary>

                  <p class="message"><b>Alasan:</b><br>${esc(request.reason)}</p>

                  <p class="request-id">
                    ID: ${esc(request.request_id)}
                  </p>
                </details>
              </article>
            `).join('')
            : `
              <section
                class="card"
                style="margin-top:18px">

                <p class="page-desc">
                  Belum ada pengajuan perubahan jadwal.
                </p>

                ${primary(
                  'Ajukan Perubahan Jadwal',
                  'form'
                )}
              </section>
            `
          }

          <div id="error"></div>
          ${notice(hours)}

          <button class="secondary" data-action="copy">
            Salin Link Riwayat
          </button>

          <div
            id="copy-result"
            class="muted"
            style="margin-top:10px"></div>
        `;

      } catch (error) {
        if (current === view) {
          app.innerHTML = `
            ${header('history')}
            <div id="error"></div>
            ${primary(
              'Coba Muat Riwayat Lagi',
              'history'
            )}
          `;

          showError(error.message);
        }
      }
    }

    app.addEventListener('submit', event => {
      if (event.target.id === 'lookup') {
        lookup(event);
      }

      if (event.target.id === 'request') {
        prepare(event);
      }
    });

    app.addEventListener('change', event => {
      const el = event.target;
      const list = student ? subjects() : [];

      if (el.dataset.subject !== undefined) {
        const name = list[Number(el.dataset.subject)];

        if (el.checked) {
          draft[name] = '';
        } else {
          delete draft[name];
        }

        renderSlots();
      }

      if (el.dataset.slot !== undefined) {
        draft[list[Number(el.dataset.slot)]] =
          el.value;
      }

      if (el.id === 'reason') {
        document.getElementById('other-reason').hidden =
          el.value !== 'lain';

        reason = el.value === 'lain'
          ? document.getElementById('other').value.trim()
          : el.value;
      }
    });

    app.addEventListener('input', event => {
      if (event.target.id === 'other') {
        reason = event.target.value;
      }
    });

    app.addEventListener('click', async event => {
      const button =
        event.target.closest('[data-action]');

      if (!button || busy) return;

      const action = button.dataset.action;

      if (action === 'home') home();
      if (action === 'form') form();
      if (action === 'history') historyPage();
      if (action === 'send') send(button);

      if (action === 'retry-pending' && pending) {
        review();
      }

      if (action === 'logout') {
        store('colearn-student', null);

        student = null;
        pending = null;
        draft = {};
        reason = '';

        history.replaceState(null, '', '/');
        login();
      }

      if (action === 'copy') {
        const link = location.origin + '/' +
          encodeURIComponent(student.user_id);

        try {
          await navigator.clipboard.writeText(link);

          document.getElementById(
            'copy-result'
          ).textContent =
            'Link riwayat berhasil disalin.';

        } catch (_) {
          document.getElementById(
            'copy-result'
          ).textContent = link;
        }
      }
    });

    const saved = load('colearn-student');
    let pathId = '';

    try {
      pathId = decodeURIComponent(
        location.pathname.replace(/^\/+|\/+$/g, '')
      );
    } catch (_) {}

    if (
      saved &&
      saved.user_id &&
      saved.phone_number &&
      (
        !pathId ||
        pathId === 'index.html' ||
        pathId === saved.user_id
      )
    ) {
      login('Memuat data murid...');

      document.getElementById('phone').value =
        saved.phone_number;

      lookup({
        preventDefault() {}
      }).then(() => {
        if (
          student &&
          pathId === student.user_id
        ) {
          historyPage();
        }
      });

    } else {
      login(
        pathId && pathId !== 'index.html'
          ? 'Masukkan nomor HP terdaftar untuk membuka halaman murid.'
          : ''
      );
    }
  })();
  </script>
